<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>贪吃蛇</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="app" aria-label="贪吃蛇游戏">
      <section class="topbar" aria-label="游戏标题">
        <div>
          <h1>贪吃蛇</h1>
        </div>
        <div class="scoreboard" aria-label="得分">
          <div class="metric">
            <span>分数</span>
            <strong id="score">0</strong>
          </div>
          <div class="metric">
            <span>最高分</span>
            <strong id="bestScore">0</strong>
          </div>
          <div class="metric">
            <span>等级</span>
            <strong id="level">1</strong>
          </div>
        </div>
      </section>

      <section class="layout">
        <aside class="panel status-panel" aria-label="本局状态">
          <div class="panel-header">
            <span class="dot"></span>
            <h2>本局</h2>
          </div>
          <div class="stat-grid">
            <div>
              <span>长度</span>
              <strong id="length">3</strong>
            </div>
            <div>
              <span>连击</span>
              <strong id="combo">x1</strong>
            </div>
            <div>
              <span>速度</span>
              <strong id="speed">1.0x</strong>
            </div>
          </div>
          <div class="feed" aria-live="polite">
            <p id="eventText">准备开始一局漂亮的走位。</p>
            <div class="progress-track" aria-label="等级进度">
              <span id="levelProgress"></span>
            </div>
          </div>
        </aside>

        <section class="game-shell" aria-label="游戏棋盘">
          <canvas id="board" width="600" height="600"></canvas>
          <div class="overlay visible" id="overlay">
            <div class="overlay-panel">
              <p class="overlay-kicker" id="overlayKicker">准备</p>
              <p class="overlay-title" id="overlayTitle">选择难度后开始游戏。</p>
              <button class="primary-button" id="startButton" type="button">开始</button>
            </div>
          </div>
        </section>

        <aside class="panel options-panel" aria-label="游戏设置">
          <div class="settings-top">
            <div class="panel-header">
              <span class="dot alt"></span>
              <h2>设置</h2>
            </div>

            <div class="option-group">
              <span class="option-title">难度</span>
              <div class="segmented" id="difficultyGroup" role="group" aria-label="难度">
                <button class="segment active" data-difficulty="chill" type="button">轻松</button>
                <button class="segment" data-difficulty="rush" type="button">冲刺</button>
                <button class="segment" data-difficulty="pro" type="button">高手</button>
              </div>
            </div>

            <div class="option-group">
              <span class="option-title">皮肤</span>
              <div class="skin-grid" id="skinGroup" role="group" aria-label="蛇皮肤">
                <button class="skin-card active" data-skin="bamboo" type="button" aria-label="青竹皮肤">
                  <span class="skin-swatch bamboo"></span>
                  <strong>青竹</strong>
                </button>
                <button class="skin-card" data-skin="neon" type="button" aria-label="霓虹皮肤">
                  <span class="skin-swatch neon"></span>
                  <strong>霓虹</strong>
                </button>
                <button class="skin-card" data-skin="lava" type="button" aria-label="熔岩皮肤">
                  <span class="skin-swatch lava"></span>
                  <strong>熔岩</strong>
                </button>
                <button class="skin-card" data-skin="glacier" type="button" aria-label="冰川皮肤">
                  <span class="skin-swatch glacier"></span>
                  <strong>冰川</strong>
                </button>
                <button class="skin-card" data-skin="candy" type="button" aria-label="糖果皮肤">
                  <span class="skin-swatch candy"></span>
                  <strong>糖果</strong>
                </button>
                <button class="skin-card" data-skin="shadow" type="button" aria-label="暗影皮肤">
                  <span class="skin-swatch shadow"></span>
                  <strong>暗影</strong>
                </button>
                <button class="skin-card" data-skin="royal" type="button" aria-label="皇家皮肤">
                  <span class="skin-swatch royal"></span>
                  <strong>皇家</strong>
                </button>
                <button class="skin-card" data-skin="circuit" type="button" aria-label="电路皮肤">
                  <span class="skin-swatch circuit"></span>
                  <strong>电路</strong>
                </button>
              </div>
            </div>
          </div>

          <div class="settings-bottom">
            <div class="option-row">
              <label for="soundToggle">音乐与音效</label>
              <input id="soundToggle" type="checkbox" checked />
            </div>

            <div class="controls" aria-label="游戏控制">
              <button class="icon-button" id="pauseButton" type="button" aria-label="暂停或继续" title="暂停或继续">
                <span id="pauseIcon">></span>
              </button>
              <button class="text-button" id="restartButton" type="button">重新开始</button>
            </div>
          </div>
        </aside>
      </section>

      <section class="pad" aria-label="方向键">
        <button class="pad-button up" data-direction="up" type="button" aria-label="向上移动">&uarr;</button>
        <button class="pad-button left" data-direction="left" type="button" aria-label="向左移动">&larr;</button>
        <button class="pad-button center" id="mobilePauseButton" type="button" aria-label="暂停或继续">></button>
        <button class="pad-button right" data-direction="right" type="button" aria-label="向右移动">&rarr;</button>
        <button class="pad-button down" data-direction="down" type="button" aria-label="向下移动">&darr;</button>
      </section>
    </main>

    <script src="scripts/config.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/audio.js"></script>
    <script src="scripts/render.js"></script>
    <script src="scripts/game.js"></script>
  </body>
</html>
