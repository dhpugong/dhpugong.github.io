<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>火柴人对抗</title>
    <meta name="description" content="本地双人横版火柴人格斗游戏。" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="arena-app" aria-label="火柴人对抗">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Duel / Canvas Fighter</p>
          <h1>火柴人对抗</h1>
        </div>
        <a class="home-link" href="../">项目导航</a>
      </header>

      <section class="hud-panel" aria-label="对战状态">
        <div class="fighter-status left">
          <span>P1</span>
          <strong id="p1Name">青锋</strong>
          <div class="health-track"><span id="p1Health"></span></div>
        </div>
        <div class="round-clock">
          <span>TIME</span>
          <strong id="roundTime">99</strong>
        </div>
        <div class="fighter-status right">
          <span>P2</span>
          <strong id="p2Name">苍雷</strong>
          <div class="health-track"><span id="p2Health"></span></div>
        </div>
      </section>

      <section class="stage-shell" aria-label="格斗舞台">
        <canvas id="fightCanvas" width="960" height="540"></canvas>
        <div class="overlay visible" id="overlay">
          <div class="overlay-panel">
            <p id="overlayKicker">READY</p>
            <h2 id="overlayTitle">本地双人，一局定胜负。</h2>
            <button class="primary-button" id="startButton" type="button">开始对抗</button>
          </div>
        </div>
      </section>

      <section class="control-grid" aria-label="键位说明">
        <article class="control-card">
          <h2>P1 键位</h2>
          <p><kbd>A</kbd><kbd>D</kbd>左右移动 <kbd>S</kbd>防御</p>
          <p><kbd>J</kbd>攻击/确定 <kbd>K</kbd>跳跃 <kbd>L</kbd>冲刺 <kbd>U</kbd>远攻</p>
        </article>
        <article class="control-card">
          <h2>P2 键位</h2>
          <p><kbd>←</kbd><kbd>→</kbd>左右移动 <kbd>↓</kbd>防御</p>
          <p><kbd>1</kbd>攻击/确定 <kbd>2</kbd>跳跃 <kbd>3</kbd>冲刺 <kbd>4</kbd>远攻</p>
        </article>
        <article class="control-card actions">
          <h2>控制</h2>
          <div>
            <button class="ghost-button" id="pauseButton" type="button">暂停</button>
            <button class="ghost-button" id="restartButton" type="button">重新开始</button>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
